plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// ------------------ 仓库配置（沿用旧项目宝贵经验，保留绝大部分镜像和 Maven） ------------------
repositories.clear()

repositories {
    // 国内 NeoForge 镜像（保底）
    maven {
        name = 'ForgeCDN'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    maven {
        name = 'ForgeCDNMojang'
        url = 'https://neoforged.forgecdn.net/mojang-meta'
    }
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    maven { url = "https://mvn.devos.one/snapshots" }

    // 必备：Create 和相关模组的 Maven
    maven { url = "https://maven.createmod.net" }

    // KubeJS（Latvian 官方 maven）
    maven { name = "Latvian"; url = "https://maven.latvian.dev/releases" }

    // CurseForge 备用
    maven {
        name = "CurseForge"
        url = "https://www.cursemaven.com"
    }

    // Modrinth 备用
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    mavenCentral()

    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }

    // Veil 仓库以防万一
    maven { url = "https://maven.sammy.vectorwing.dev" }

    // Curios 仓库以防万一
    maven {
        name = "Illusive Soulworks Maven"
        url = "https://maven.theillusivec4.top/"
    }

    // JEI 仓库
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ------------------ NeoForge 配置------------------
neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ★ 新增：第二个客户端
        client2 {
            client()
            gameDirectory = project.file('run2')
            programArguments.addAll '--username', 'Dev2'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ------------------ 依赖配置（精准清理与合并） ------------------
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create 本体
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }

    // Create 的附属库
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // KubeJS —— 仅编译期可见，不打包、不进入运行时类路径
    // 注意：不要加 transitive = false —— KubeJS API 暴露 Rhino 类型，Rhino 必须在编译类路径上
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
}

// ------------------ 元数据生成 ------------------
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,

            // Create 相关变量，供 TOML 依赖声明使用
            create_version         : create_version,
            create_mod_version     : create_mod_version,
            jei_version            : jei_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// ------------------ 发布配置------------------
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}