plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'  // Mixin Gradle 插件
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'  // Parchment 映射
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)  // Forge 1.20.1 需要 Java 17

// ------------------ Mixin 配置 ------------------
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// ------------------ 仓库配置 ------------------
repositories {
    // Create、Ponder、Flywheel 官方仓库
    maven { url = "https://maven.createmod.net" }
    // Registrate 仓库
    maven { url = "https://maven.ithundxr.dev/mirror" }
    // ForgeConfigAPIPort 仓库（Create 1.20.1 依赖）
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

    // JEI 仓库
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }

    mavenCentral()
}

// ------------------ Forge 配置 ------------------
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    
    // 访问转换器（1.20.1 推荐配置）
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // 运行配置
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client2 {
            client()
            workingDirectory project.file('run2')
            programArguments.addAll '--username', 'Dev2'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            programArgument '--nogui'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            
            args '--mod', mod_id, '--all', 
                 '--output', file('src/generated/resources/').getAbsolutePath(),
                 '--existing', file('src/main/resources/').getAbsolutePath()
            
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// ------------------ 资源目录 ------------------
sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// ------------------ 依赖配置 ------------------
dependencies {
    // Forge 本体
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ---- Create 及其依赖（Forge 版） ----
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))

    // ---- JEI ----
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // ---- Mixin 注解处理器 ----
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// ------------------ 元数据生成 ------------------
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            create_version         : create_version,
            create_mod_version     : create_version,
            jei_version            : jei_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
// ★ Forge 没有 neoForge.ideSyncTask，改为让 compileJava 依赖它
tasks.named('compileJava') {
    dependsOn generateModMetadata
}

// ------------------ Jar 清单 ------------------
jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_group_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_group_id,
                "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
}

// ------------------ 发布配置 ------------------
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}